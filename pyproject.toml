[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-catalogue-guard"
version = "1.0.0"
description = "Traceable retail catalogue review across products, recalls and price observations"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.3,<2", "numpy>=1.26,<3", "pyarrow>=18,<30", "requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
catalogue-guard = "catalogue_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalogue_guard = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
